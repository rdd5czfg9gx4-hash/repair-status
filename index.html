<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据服务中心</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    background: #f4f7fb;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #333;
}

.card {
    width: 90%;
    max-width: 520px;
    background: #fff;
    border-radius: 18px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

.icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #e8f7ee;
    color: #20a05a;
    font-size: 42px;
    line-height: 72px;
}

h1 {
    margin: 0 0 12px;
    font-size: 26px;
    color: #222;
}

.status {
    display: inline-block;
    padding: 7px 18px;
    border-radius: 20px;
    background: #e8f7ee;
    color: #168447;
    font-size: 15px;
    margin-bottom: 28px;
}

.info {
    text-align: left;
    background: #f7f9fc;
    border-radius: 12px;
    padding: 20px;
    line-height: 2;
    font-size: 15px;
}

.label {
    color: #777;
}

.value {
    color: #222;
    font-weight: bold;
}

.footer {
    margin-top: 24px;
    font-size: 12px;
    color: #999;
}
</style>
</head>

<body>

<div class="card">

    <div class="icon">✓</div>

    <h1>数据服务中心</h1>

    <div class="status">修复处理完成</div>

    <div class="info">
        <div>
            <span class="label">处理编号：</span>
            <span class="value">26368</span>
        </div>

        <div>
            <span class="label">当前状态：</span>
            <span class="value">已完成</span>
        </div>

        <div>
            <span class="label">处理结果：</span>
            <span class="value">数据检查及异常处理完成</span>
        </div>
    </div>

    <div class="footer">
        企业内部数据处理结果页面
    </div>

</div>

</body>
</html>
